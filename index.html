<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Диагностика</title>
    <style>
        body { font-family: -apple-system, sans-serif; padding: 20px; }
        button { padding: 12px 20px; margin: 8px; font-size: 16px; display: block; width: 100%; }
        .result { background: #f0f0f0; padding: 10px; margin: 10px 0; border-radius: 8px; }
    </style>
</head>
<body>

    <h2>🔍 Диагностика</h2>

    <button onclick="testAlert()">1. Простой alert</button>
    <div class="result" id="result1">Нажми кнопку 1</div>

    <button onclick="testDOM()">2. Изменить этот текст</button>
    <div class="result" id="result2">Нажми кнопку 2</div>

    <button onclick="testLocalStorage()">3. Записать в localStorage</button>
    <div class="result" id="result3">Нажми кнопку 3</div>

    <button onclick="testClipboard()">4. Скопировать "Привет"</button>
    <div class="result" id="result4">Нажми кнопку 4</div>

    <script>
        function testAlert() {
            alert('JavaScript работает!');
            document.getElementById('result1').innerHTML = '✅ Alert сработал';
        }

        function testDOM() {
            document.getElementById('result2').innerHTML = '✅ DOM изменён в ' + new Date().toLocaleTimeString();
        }

        function testLocalStorage() {
            try {
                localStorage.setItem('test', 'работает');
                var val = localStorage.getItem('test');
                document.getElementById('result3').innerHTML = '✅ localStorage: ' + val;
            } catch(e) {
                document.getElementById('result3').innerHTML = '❌ localStorage недоступен: ' + e.message;
            }
        }

        function testClipboard() {
            // Способ 1
            if (navigator.clipboard) {
                navigator.clipboard.writeText('Привет').then(function() {
                    document.getElementById('result4').innerHTML = '✅ Скопировано через clipboard API';
                }).catch(function() {
                    fallback();
                });
            } else {
                fallback();
            }

            function fallback() {
                var ta = document.createElement('textarea');
                ta.value = 'Привет';
                document.body.appendChild(ta);
                ta.select();
                try {
                    document.execCommand('copy');
                    document.getElementById('result4').innerHTML = '✅ Скопировано через execCommand';
                } catch(e) {
                    document.getElementById('result4').innerHTML = '❌ Копирование не работает: ' + e.message;
                }
                document.body.removeChild(ta);
            }
        }
    </script>

</body>
</html>
